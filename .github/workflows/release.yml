name: Build & Release

# Startet automatisch wenn ein Tag wie "v1.3.2" oder "v1.3.2-beta.1" gepusht wird
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            eb_args: --mac
          - os: windows-latest
            eb_args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Icons generieren
        run: node scripts/generate-icon.mjs

      - name: winCodeSign-Cache vorbereiten (nur Windows)
        if: runner.os == 'Windows'
        run: node scripts/setup-wincosign-cache.js

      - name: Bauen
        run: npm run build

      # Prerelease: Tag enthält "-" z.B. v1.3.2-beta.1 → kein "latest", kein Auto-Update
      - name: Hochladen als Prerelease
        if: contains(github.ref_name, '-')
        run: npx electron-builder ${{ matrix.eb_args }} --config.publish.releaseType=prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Stable: Tag ohne "-" z.B. v1.3.2 → bekommt "latest", löst Auto-Update aus
      - name: Hochladen als Release
        if: "!contains(github.ref_name, '-')"
        run: npx electron-builder ${{ matrix.eb_args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
