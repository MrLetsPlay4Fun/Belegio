appId: one.hippler.belegio
productName: Belegio
copyright: Copyright © 2025 Alexander Hippler

directories:
  buildResources: assets
  output: release

# Dateien die ins App-Paket kommen
files:
  - dist/**
  - connectors/**
  - package.json

# playwright aus dem asar-Archiv auspacken, damit Node.js-Internals
# (child_process, Pfadauflösung) korrekt funktionieren
asarUnpack:
  - node_modules/playwright/**
  - node_modules/playwright-core/**

win:
  icon: assets/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Keine Code-Signatur (kein Zertifikat vorhanden)
  sign: null
  signingHashAlgorithms: null
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - de_DE
  license: null

mac:
  icon: assets/icon.png
  artifactName: "${productName}-${version}.${ext}"
  # Keine Code-Signatur (kein Apple Developer Account vorhanden)
  # Nutzer müssen beim ersten Öffnen Rechtsklick → Öffnen wählen (Gatekeeper)
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg

dmg:
  title: "${productName} ${version}"
  internetEnabled: false

# GitHub Releases – Upload erfolgt mit: GH_TOKEN=... npm run dist
publish:
  provider: github
  owner: AxonByteDev
  repo: Belegio
  releaseType: release
